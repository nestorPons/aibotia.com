services:
  web:
    restart: always
    ports: !reset []
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.aibotia.rule=Host(`aibotia.com`, `www.aibotia.com`)"
      - "traefik.http.routers.aibotia.entrypoints=web,websecure"
      - "traefik.http.routers.aibotia.tls=true"
      - "traefik.http.routers.aibotia.tls.certresolver=myresolver"
      - "traefik.http.services.aibotia.loadbalancer.server.port=80"

  db:
    restart: always
    ports: !reset []

  phpmyadmin:
    restart: always
    ports: !reset []
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.aibotia-pma.rule=Host(`pma.aibotia.com`)"
      - "traefik.http.routers.aibotia-pma.entrypoints=web,websecure"
      - "traefik.http.routers.aibotia-pma.tls=true"
      - "traefik.http.routers.aibotia-pma.tls.certresolver=myresolver"
      - "traefik.http.services.aibotia-pma.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
