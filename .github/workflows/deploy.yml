name: Deploy a VPS Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aibotia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave SSH
        run: |
          set -euo pipefail
          PORT="$(printf '%s' "${SSH_PORT:-22}" | tr -d '\r\n' | xargs)"
          [ -n "$PORT" ] || PORT=22
          SSH_HOST_C="$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | xargs)"
          KEY="$HOME/.ssh/deploy_key"
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          head -1 "$KEY" | grep -qE 'BEGIN .*PRIVATE KEY' || { echo "::error::SSH_KEY no parece una clave privada"; exit 1; }
          rm -f "$HOME/.ssh/known_hosts"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST_C" >> "$HOME/.ssh/known_hosts"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Subir código por rsync
        run: |
          set -euo pipefail
          PORT="$(printf '%s' "${SSH_PORT:-22}" | tr -d '\r\n' | xargs)"
          [ -n "$PORT" ] || PORT=22
          SSH_USER_C="$(printf '%s' "$SSH_USER" | tr -d '\r\n' | xargs)"
          SSH_HOST_C="$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | xargs)"
          DEST_C="$(printf '%s' "$PROJECT_PATH" | tr -d '\r\n' | xargs)"
          [ -n "$SSH_USER_C" ] && [ -n "$SSH_HOST_C" ] && [ -n "$DEST_C" ] || { echo "::error::Faltan secrets SSH_USER/SSH_HOST/PROJECT_PATH"; exit 1; }
          KEY="$HOME/.ssh/deploy_key"
          SSH_CMD="ssh -i $KEY -p $PORT -o StrictHostKeyChecking=yes"
          $SSH_CMD "${SSH_USER_C}@${SSH_HOST_C}" "mkdir -p '${DEST_C}'"
          rsync -avz --delete -s \
            -e "$SSH_CMD" \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.env.production' \
            --exclude='.history/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='.github/' \
            ./ "${SSH_USER_C}@${SSH_HOST_C}:${DEST_C}/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

      - name: Build + up en el servidor
        run: |
          set -euo pipefail
          PORT="$(printf '%s' "${SSH_PORT:-22}" | tr -d '\r\n' | xargs)"
          [ -n "$PORT" ] || PORT=22
          SSH_USER_C="$(printf '%s' "$SSH_USER" | tr -d '\r\n' | xargs)"
          SSH_HOST_C="$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | xargs)"
          DEST_C="$(printf '%s' "$PROJECT_PATH" | tr -d '\r\n' | xargs)"
          DEST_ESCAPED="$(printf '%s' "$DEST_C" | sed "s/'/'\\\\''/g")"
          ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" -o StrictHostKeyChecking=yes "${SSH_USER_C}@${SSH_HOST_C}" \
            "cd '${DEST_ESCAPED}' && docker compose up -d --build && docker image prune -f"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
