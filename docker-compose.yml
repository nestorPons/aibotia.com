services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibotia_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:alpine
    container_name: aibotia_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - internal

  db:
    image: mariadb:11
    container_name: aibotia_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aibotia
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: aibotia
      MYSQL_PASSWORD: aibotia
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aibotia_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - internal

volumes:
  dbdata:

networks:
  internal:
    driver: bridge
