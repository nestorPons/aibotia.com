services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibotia_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:alpine
    container_name: aibotia_web
    restart: always
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.aibotia.rule=Host(`aibotia.com`) || Host(`www.aibotia.com`)"
      - "traefik.http.routers.aibotia.entrypoints=web,websecure"
      - "traefik.http.routers.aibotia.tls=true"
      - "traefik.http.routers.aibotia.tls.certresolver=myresolver"
      - "traefik.http.services.aibotia.loadbalancer.server.port=80"

  db:
    image: mariadb:11
    container_name: aibotia_db
    restart: always
    environment:
      MYSQL_DATABASE: aibotia
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: aibotia
      MYSQL_PASSWORD: aibotia
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  dbdata:

networks:
  internal:
    driver: bridge
  traefik-net:
    external: true
